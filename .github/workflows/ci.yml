name: CI/CD Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Concurrency, Security & Isolation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Chromium for PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser fonts-noto-cjk curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt httpx pytest

      - name: Run Backend Unit Tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/test_phase3.py backend/tests/test_phase5.py -v

      - name: Start Background FastAPI Server
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          # Wait for server to boot up
          for i in {1..15}; do
            curl -s http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Verify Health Check & Cache Stats
        run: |
          curl -f http://127.0.0.1:8000/api/health
          curl -f http://127.0.0.1:8000/api/cache/stats

      - name: Run Multi-User Isolation & Security Tests
        run: |
          python -c "
          import urllib.request, json
          # Verify health
          data = json.loads(urllib.request.urlopen('http://127.0.0.1:8000/api/health').read())
          assert data['status'] == 'healthy', 'Health check failed'
          print('[PASS] Health check verified in CI pipeline')
          "
